name: Pipeline

# One pipeline, two trigger paths (change: overhaul-release-pipeline).
#   • pull_request — fast, may have mutated the branch: verify the version bump was prepped, then the
#     quality gate and the test pyramid. These are the required checks for merging into main.
#   • push to main — idempotent: re-run the full gate, build the image, gate it through E2E, and only
#     then (if this version is not already tagged) tag, release, and publish. Nothing here commits to
#     main; a re-run of an already-released commit is a no-op.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pipeline-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a main run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # PR only: the branch must already carry the computed version bump + CHANGELOG. This job never
  # pushes — if the branch is not prepped it fails with the exact local command to run.
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # observed ~20s; a wedge should fail in minutes, not GitHub's 6h default
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # full history + tags for the merge-base recompute
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify version + CHANGELOG are prepped
        run: pnpm version:prep --check

  # Static checks that need no runtime dependencies; runs in parallel with tests. Gates the release.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed ~75s
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format
      - name: Lint (incl. dependency-rule boundaries)
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build

  # Test pyramid — every workspace package in one merged 100% coverage run (node + SSR + Chromium
  # browser-mode projects), plus the frozen-fixture contract tiers (incl. the cross-module seam
  # fixtures) and the repo-tooling unit tests. ffmpeg is a real dependency of the audio-probe
  # adapter tests; Chromium is the browser-mode runner for the web client project.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # observed ~100s; Chromium + apt installs dominate on a cold cache
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium (browser-mode client tests)
        run: pnpm --dir packages/web exec playwright install --with-deps chromium
      - name: Test @ 100% coverage
        run: pnpm run test:cov
      - name: Contract tests (frozen fixtures; no network)
        run: pnpm run test:contract
      - name: Repo-tooling tests (release + mutation-gate helpers)
        run: pnpm run test:tooling
      - name: Beets-bridge unit tests @ 100% coverage (Python)
        run: pnpm run test:bridge

  # PR only: mutation testing over the production files this branch changed (change: mutation-gate),
  # with the FAILURE scope narrowed to the changed LINES (change: mutation-gate-diff-scope).
  #
  # The `test` job proves every line EXECUTES under test. This proves a test would NOTICE the line
  # going wrong — the one axis where a suite written by the same process that writes the code would
  # otherwise grade its own homework. The signal is per-mutant, never a score: the summary names each
  # survivor with file, line, and mutation so it converges like a review finding (kill it, or justify
  # a suppression at the site).
  #
  # TWO SCOPES, deliberately different:
  #
  #   * REPORTING scope is the changed FILES. The step summary keeps the whole file-scoped inventory,
  #     so an assertion weakened elsewhere in a file this branch touched is still visible. Android
  #     lint's rule: suppress the gate, never the feedback.
  #   * FAILURE scope is the changed LINES. A branch fails only for a surviving mutant whose span
  #     OVERLAPS a line it added or modified — overlap rather than containment, so a whole-block
  #     mutant covering a function the branch edited one line of still counts.
  #
  # File-scoped FAILURE was justified by an identity: "once main is mutant-clean, a changed file's
  # untouched lines carry no survivors, so the two give the same verdict". Main is not mutant-clean
  # and cannot become so — the equivalent fraction among survivors RISES as a suite improves, and the
  # tip sits at 27 survivors / 99.56%, every one of them provably equivalent and unwaivable without
  # silencing a killable twin. With the precondition unavailable, file scope reduces to failing
  # branches for debt they did not create. See docs/research/blocking-mutation-gate-scope.md.
  #
  # Incremental mode is deliberately NOT used here (stryker.config.mjs, D4a): its report merges
  # cached whole-repo results, which would fail a branch on debt it never touched.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Measured in CI, three times, not projected: 2m32s on a 2-file diff, 9m37s on 53 changed files,
    # 13m58s on 36. Cost is mutants x tests per mutant rather than file count, which is why the
    # smaller diff was the slower run. The largest Stryker step, 13m16s, was 66% of the old
    # 20-minute budget. Once this check blocks, a timeout is a red required check on a CORRECT
    # branch — unattributable and
    # non-deterministically reproducible, which is exactly what teaches an agent loop that the
    # mutation check is the flaky one to ignore.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the merge-base diff needs real history
      # The audio-probe adapter's tests shell out to a real ffmpeg, and they are the tests that kill
      # that adapter's mutants — without it those mutants read as survivors.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve the changed production files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE="$(git merge-base "$BASE_SHA" HEAD)"

          # grep exits 1 on "no match" — a normal, passing outcome here — but 2 on ERROR, and a bare
          # `|| true` cannot tell them apart. Reading a broken pattern as "nothing changed" would be
          # a gate that greens on its own breakage, the one failure mode this job must not have.
          match() { grep "$@" || [ "$?" -eq 1 ]; }

          # The mutate scope as stryker.config.mjs defines it: production TypeScript in the two
          # context packages. `--diff-filter=ACMR` drops deletions — nothing left to mutate. The
          # character class is deliberately narrow: a path is about to become a command argument,
          # and a filename containing shell metacharacters must not be able to redirect the scope.
          FILES="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD \
            | match -E '^packages/(downloader|eventing|importer)/src/[A-Za-z0-9._/-]+\.ts$' \
            | match -vE '(\.test\.ts$|/__fixtures__/)' \
            | paste -sd, -)"

          # A path that is in scope by package but was dropped by the character class is a case
          # nobody intended; fail rather than silently mutate less than the diff.
          REJECTED="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD \
            | match -E '^packages/(downloader|eventing|importer)/src/' \
            | match -vE '(\.test\.ts$|/__fixtures__/)' \
            | match -vE '^packages/(downloader|eventing|importer)/src/[A-Za-z0-9._/-]+\.ts$')"
          if [ -n "$REJECTED" ]; then
            echo "::error::In-scope paths rejected by the safe-character filter: ${REJECTED}"
            exit 1
          fi

          echo "files=${FILES}" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "::notice::No production files changed in the mutated packages — nothing to mutate."
          else
            echo "Mutating: ${FILES}"

            # The changed LINES, for the verdict step, cut against the SAME merge-base resolved
            # above — the job resolves a base exactly once, so the mutate scope and the changed
            # hunks cannot drift onto different comparisons.
            #
            # The flags are `scripts/mutation/changed-lines.ts`'s DIFF_FLAGS and the boundary tier
            # asserts they match. `--no-prefix` is the load-bearing one: these paths are joined
            # against Stryker's report keys, which are relative to the run's working directory, and
            # a surviving `b/` would make every intersection false and the gate vacuously green.
            IFS=',' read -r -a SCOPED <<< "$FILES"
            git diff -U0 --no-prefix --diff-filter=ACMR "$BASE" HEAD -- "${SCOPED[@]}" \
              > "${RUNNER_TEMP}/changed.diff"
            echo "Changed hunks: $(grep -c '^@@' "${RUNNER_TEMP}/changed.diff" || true)"
          fi

      # `continue-on-error` stays here, and it MOVES rather than disappears. The reason is not
      # caution — it is that THIS STEP'S EXIT CODE STOPS BEING THE VERDICT (design D5).
      # `thresholds.break: 100` makes Stryker exit non-zero for any survivor anywhere in the
      # file-wide REPORTING scope, which is precisely the verdict changed-line scope rejects: it
      # fails a branch for debt it did not create, and a red check nobody can act on is one an agent
      # loop learns to ignore when it is real. The job's decision now lives in the verdict step
      # below, which carries no such flag.
      #
      # Note what this flag also forgives: Stryker CRASHING, exactly as readily as it forgives
      # survivors. That hole is closed downstream rather than here — the verdict REFUSES on a
      # missing or unreadable report instead of reading absence as a clean bill. Read "refuses"
      # precisely: while the gate ships in shadow, that refusal is a paragraph in the step summary
      # and the job is still green. It becomes a job failure the moment MUTATION_GATE_ENFORCE is
      # set, which is the same flip that makes everything else here bite.
      - name: Mutation-test the changed production files
        id: stryker
        if: steps.scope.outputs.files != ''
        continue-on-error: true
        env:
          # Never interpolate a PR-controlled value into a `run:` body — `${{ }}` substitution
          # happens before bash parses the line, so a filename's bytes would become shell syntax.
          MUTATE: ${{ steps.scope.outputs.files }}
        run: |
          set -euo pipefail
          START="$SECONDS"
          STATUS=0
          pnpm exec stryker run --mutate "$MUTATE" || STATUS="$?"
          # Surfaced with the verdict so design D2's tuning lever — range-scoping the run itself —
          # is pulled on a number rather than on somebody's patience.
          echo "seconds=$((SECONDS - START))" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      # always(): the summary's whole job is to explain a FAILING run, so it must survive one. It
      # reports the missing-report case out loud rather than reading absence as a clean bill.
      - name: Surface the surviving mutants
        if: always() && steps.scope.outputs.files != ''
        run: pnpm tsx scripts/mutation/report.ts >> "$GITHUB_STEP_SUMMARY"

      # The job's decision, and the only step that carries it. always() for the same reason as the
      # summary and a sharper one: a run that CRASHED is when this step matters most, so skipping it
      # on a failed Stryker step would skip the very step meant to fail on a crash. No
      # `continue-on-error` here, deliberately — that flag is what made the gate inert.
      #
      # Shipped in SHADOW: `MUTATION_GATE_ENFORCE` is absent, so the verdict is computed, published
      # to the step summary, and does not fail the job. `mutation-gate` 4.1a/4.1b flip that switch
      # and the main-branch required check together, in one step, once the shadow measurement clears
      # quality-gates.md's ten-percent effective-false-positive bar on real PRs here.
      - name: Verdict — surviving mutants on the changed lines
        if: always() && steps.scope.outputs.files != ''
        env:
          MUTATION_STRYKER_SECONDS: ${{ steps.stryker.outputs.seconds }}
        run: |
          set -euo pipefail
          pnpm tsx scripts/mutation/pr-verdict.ts "${RUNNER_TEMP}/changed.diff" \
            >> "$GITHUB_STEP_SUMMARY"

  # main only, after the gate is green: build the image once, gate it through the out-of-process E2E
  # tier — browser parity phase included, so Playwright drives the same image that publishes — then,
  # only if package.json's version is not already tagged, tag, release, and publish. The version is
  # read from package.json (bumped pre-merge), never recomputed here.
  release:
    if: github.event_name == 'push'
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30 # observed ~3.5min warm; a cold-cache build + full E2E stays well under this
    permissions:
      contents: write # create the release tag + GitHub Release
      packages: write # push the GHCR image
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags for the already-released guard

      # Read the release version and decide whether this commit still needs releasing.
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "minor=v$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} already released — build + E2E will run, publish will be skipped"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=raw,value=latest
            type=sha

      # Build ONCE, load locally as `music-downloader:e2e`. This is the only build in the job: the
      # publish step below re-tags and pushes these exact bytes, so the published artifact is
      # byte-for-byte the image the E2E gate ran (a rebuild — even fully cache-hit — re-executes
      # non-hermetic Dockerfile steps like apt-get/pip and can publish an untested image). The
      # metadata labels are applied here so the gated image already carries them.
      - name: Build image (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: music-downloader:e2e
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium (browser parity phase)
        run: pnpm --dir packages/web exec playwright install --with-deps chromium

      # THE GATE: stand up the freshly built image + WireMock stubs, drive it end to end over a real
      # socket — a real browser first (parity phase), then the loop phases (run.sh owns the list) —
      # tear down. A failure here fails the job and blocks the publish + release steps below.
      - name: Out-of-process E2E gate
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm test:e2e
      - name: Upload Playwright traces (parity-phase failures)
        # cancelled() included: a job-timeout cancellation (the new timeout-minutes ceilings) must
        # still surface its diagnostics, or a wedge dies unexplained.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: packages/web/test-results/
          # warn (not ignore): loop-phase failures legitimately have no traces, but if the
          # Playwright output path ever drifts, the annotation is the only signal we'd get.
          if-no-files-found: warn

      # Everything below is the release, guarded on the version not already being tagged. Order:
      # publish the image, then tag + GitHub Release — so `latest`/semver only move on a green E2E.
      # Publish = re-tag + push of the ALREADY-GATED local image. Never rebuild here: the guarantee
      # is that what lands in GHCR is the artifact the E2E gate exercised, not a cache-dependent
      # reconstruction of it. (Single-platform image — the build above uses the runner's platform —
      # so a plain docker push carries the exact manifest.)
      - name: Publish image (the e2e-gated bytes)
        if: steps.ver.outputs.released == 'false'
        run: |
          set -euo pipefail
          # A missing/renamed step output interpolates as EMPTY STRING silently — without these
          # guards a metadata-action drift would push zero tags, exit 0, and release over a
          # nonexistent image (surfacing days later at deploy time).
          TAGS="${{ steps.meta.outputs.tags }}"
          if [ -z "${TAGS//[[:space:]]/}" ]; then
            echo "::error::metadata produced no tags — refusing to release without publishing an image"
            exit 1
          fi
          PUSHED=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag music-downloader:e2e "$tag"
            docker push "$tag"
            PUSHED=$((PUSHED + 1))
          done <<< "$TAGS"
          if [ "$PUSHED" -lt 1 ]; then
            echo "::error::zero tags pushed — the publish loop must move at least one tag"
            exit 1
          fi
          echo "pushed ${PUSHED} tag(s) of the e2e-gated image"

      - name: Tag + GitHub Release
        if: steps.ver.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          pnpm tsx scripts/release/changelog-section.ts "$VERSION" > /tmp/notes.md
          # The runner has no git identity; an annotated tag needs a tagger.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/notes.md
